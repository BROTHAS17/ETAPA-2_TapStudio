<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>La Tiendita · Productos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261014-bootstrap">

    <!-- React 18, ReactDOM y Babel Standalone (CDN) -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="appShell">
    <!-- BARRA SUPERIOR -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9l1-5h14l1 5"></path>
                    <path d="M3 9h18"></path>
                    <path d="M5 9v10h14V9"></path>
                    <path d="M9 19v-6h6v6"></path>
                </svg>
            </span>
            <div class="brand-text">
                <h1>La Tiendita</h1>
                <p>Sistema de inventario</p>
            </div>
        </div>
        <div class="who">
            <span class="sync-pill" id="syncPill">
                <span class="dot neutral" id="syncDot"></span>
                <span id="syncPillText">En línea</span>
            </span>
            <div class="who-chip">
                <div class="name" id="whoName">—</div>
                <div class="role" id="whoRole">Administrador/a</div>
            </div>
            <button class="btn btn-ghost btn-small" id="logoutBtn" type="button">Salir</button>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL CON BARRA LATERAL -->
    <div class="layout">
        <!-- BARRA LATERAL IZQUIERDA -->
        <nav class="sidebar" id="sidebarNav"></nav>

        <!-- ÁREA DE CONTENIDO (REACT MONTA AQUÍ) -->
        <main id="mainArea">
            <div id="root">
                <div class="d-flex justify-content-center align-items-center" style="min-height: 50vh;">
                    <div class="text-center">
                        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Cargando aplicación...</span>
                        </div>
                        <h5 class="text-secondary">Cargando catálogo de productos...</h5>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- NAVEGACIÓN MÓVIL INFERIOR -->
    <nav class="bottom-tabs" id="bottomNav"></nav>
</div>

<!-- Scripts de soporte -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/sidebar.js"></script>
<script src="js/alertas.js"></script>
<script src="src/services/apiProductos.js"></script>
<script src="js/productos.js"></script>

<!-- Componente React principal -->
<script type="text/babel">
/**
 * Mi Tiendita - Modulo de Productos en React
 * Integrante 1: Migracion a React, Arquitectura de Componentes y Consumo de Catalogo Externo.
 *
 * Diseno 100% integrado al sistema visual de La Tiendita:
 * - Utiliza las clases y variables exactas de styles.css (.modal-overlay, .product-modal, .field, .btn-accent, .btn-ghost).
 * - Sin Bootstrap modal generico: armoniza con Fraunces, Work Sans y la paleta de colores.
 * - Sin imagenes en las tarjetas ni en el formulario.
 * - Cero terminos tecnicos de cara al usuario.
 * - Sincronizacion directa con localStorage ('tiendita_productos').
 * - Cero emojis.
 */

const { useState, useEffect, useMemo, useRef } = React;

// ============================================================================
// COMPONENTE: Modal Formulario de Producto (Crear / Editar)
// Disenado con la misma linea estetica de La Tiendita (.product-modal de styles.css)
// ============================================================================
function FormularioProductoModal({
    abierto,
    onCerrar,
    onGuardar,
    productoEditando,
    productosExistentes,
    terminoInicialParaBuscar
}) {
    const estadoInicial = {
        codigo: "",
        nombre: "",
        categoria: "",
        costo: "",
        precio: "",
        stock: "0",
        stockMinimo: "5"
    };

    const [formData, setFormData] = useState(estadoInicial);
    const [errores, setErrores] = useState({});

    // Estados de consulta sugerida
    const [busquedaSugerida, setBusquedaSugerida] = useState("");
    const [estadoConsulta, setEstadoConsulta] = useState("idle"); // 'idle' | 'cargando' | 'encontrado' | 'no_encontrado' | 'error'
    const [mensajeConsulta, setMensajeConsulta] = useState("");
    const [productoEncontrado, setProductoEncontrado] = useState(null);

    const inputCostoRef = useRef(null);
    const inputSugeridaRef = useRef(null);

    // Reiniciar y cargar datos cuando se abre el modal
    useEffect(() => {
        if (!abierto) return;

        if (productoEditando) {
            setFormData({
                codigo: productoEditando.codigo || "",
                nombre: productoEditando.nombre || "",
                categoria: productoEditando.categoria || "",
                costo: String(productoEditando.costo ?? ""),
                precio: String(productoEditando.precio ?? ""),
                stock: String(productoEditando.stock ?? "0"),
                stockMinimo: String(productoEditando.stockMinimo ?? "5")
            });
            setBusquedaSugerida(productoEditando.nombre || productoEditando.codigo || "");
            setEstadoConsulta("idle");
            setMensajeConsulta("");
            setProductoEncontrado(null);
        } else {
            setFormData(estadoInicial);
            setErrores({});
            setProductoEncontrado(null);

            if (terminoInicialParaBuscar && terminoInicialParaBuscar.trim()) {
                const term = terminoInicialParaBuscar.trim();
                setBusquedaSugerida(term);
                ejecutarConsulta(term);
            } else {
                setBusquedaSugerida("");
                setEstadoConsulta("idle");
                setMensajeConsulta("");
                // Enfocar el campo de busqueda de sugerencias
                setTimeout(() => {
                    if (inputSugeridaRef.current) {
                        inputSugeridaRef.current.focus();
                    }
                }, 100);
            }
        }
    }, [abierto, productoEditando, terminoInicialParaBuscar]);

    if (!abierto) return null;

    const esEdicion = Boolean(productoEditando && productoEditando.id);

    // Funcion interna para consultar informacion sugerida
    const ejecutarConsulta = async (termino) => {
        const query = String(termino || "").trim();
        if (!query) {
            setEstadoConsulta("error");
            setMensajeConsulta("Escribe el nombre de un producto o codigo para buscar sugerencias.");
            return;
        }

        setEstadoConsulta("cargando");
        setMensajeConsulta("");
        setProductoEncontrado(null);

        try {
            const resultado = await consultarProductoExterno(query);

            if (resultado.exito && resultado.producto) {
                const prod = resultado.producto;
                setEstadoConsulta("encontrado");
                setProductoEncontrado(prod);
                setMensajeConsulta(
                    "Informacion sugerida cargada. Revisa o modifica los valores de compra y venta para tu tienda."
                );

                setFormData((prev) => {
                    const actualizado = { ...prev };
                    if (prod.codigo) actualizado.codigo = prod.codigo;
                    if (prod.nombre) actualizado.nombre = prod.nombre;
                    if (prod.categoria) actualizado.categoria = prod.categoria;
                    if (prod.costo) actualizado.costo = String(prod.costo);
                    if (prod.precio) actualizado.precio = String(prod.precio);
                    if (prod.stock) actualizado.stock = String(prod.stock);
                    return actualizado;
                });

                // Enfocar el costo para que el usuario pueda ajustarlo comodamente
                setTimeout(() => {
                    if (inputCostoRef.current) {
                        inputCostoRef.current.focus();
                    }
                }, 150);
            } else if (resultado.tipoError === "no_encontrado") {
                setEstadoConsulta("no_encontrado");
                setMensajeConsulta(
                    "No se encontro informacion para \"" + query + "\" en el catalogo sugerido. Puedes ingresar los datos manualmente."
                );
            } else {
                setEstadoConsulta("error");
                setMensajeConsulta(
                    resultado.mensaje || "No fue posible conectar con el catalogo en linea. Puedes registrar el producto manualmente."
                );
            }
        } catch (error) {
            setEstadoConsulta("error");
            setMensajeConsulta("Ocurrio un problema al consultar. Puedes registrar el producto manualmente.");
        }
    };

    const handleBuscarClick = (e) => {
        if (e) e.preventDefault();
        ejecutarConsulta(busquedaSugerida);
    };

    const handleProbarSugerencia = (sugerencia) => {
        setBusquedaSugerida(sugerencia);
        ejecutarConsulta(sugerencia);
    };

    const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));

        if (errores[name]) {
            setErrores((prev) => ({ ...prev, [name]: null }));
        }
    };

    const handleSubmit = (e) => {
        e.preventDefault();

        const validacion = validarProducto(
            formData,
            productosExistentes,
            esEdicion ? productoEditando.id : null
        );

        if (!validacion.valido) {
            setErrores(validacion.errores);
            return;
        }

        const productoFinal = {
            id: esEdicion ? productoEditando.id : Date.now(),
            codigo: formData.codigo.trim(),
            nombre: formData.nombre.trim(),
            categoria: formData.categoria,
            costo: Number(formData.costo),
            precio: Number(formData.precio),
            stock: Number(formData.stock),
            stockMinimo: Number(formData.stockMinimo)
        };

        onGuardar(productoFinal);
    };

    // Calculo del margen comercial en tiempo real
    const costoNum = Number(formData.costo);
    const precioNum = Number(formData.precio);
    const tienePreciosValidos = !isNaN(costoNum) && !isNaN(precioNum) && costoNum > 0 && precioNum > 0;
    const margenMonto = tienePreciosValidos ? (precioNum - costoNum).toFixed(2) : null;
    const margenPorcentaje = tienePreciosValidos && costoNum > 0
        ? (((precioNum - costoNum) / costoNum) * 100).toFixed(1)
        : null;

    return (
        <div
            className="modal-overlay"
            onClick={(e) => {
                if (e.target === e.currentTarget) onCerrar();
            }}
        >
            <div className="product-modal modal-wide">
                {/* Cabecera del modal */}
                <div className="product-modal-head">
                    <h3>{esEdicion ? "Editar producto" : "Registrar producto"}</h3>
                    <button
                        type="button"
                        className="icon-btn"
                        onClick={onCerrar}
                        title="Cerrar ventana"
                        aria-label="Cerrar"
                    >
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <form onSubmit={handleSubmit} noValidate>
                    {/* SECCION 1: ASISTENTE DE SUGERENCIAS (Solo visible al crear) */}
                    {!esEdicion && (
                        <div
                            style={{
                                background: "var(--surface-2)",
                                border: "1px solid var(--border)",
                                borderRadius: "var(--radius-m)",
                                padding: "16px 18px",
                                marginBottom: "20px"
                            }}
                        >
                            <div className="d-flex justify-content-between align-items-center mb-1">
                                <span style={{ fontWeight: 600, fontSize: "0.92rem", color: "var(--ink)" }}>
                                    Buscar en catálogo sugerido
                                </span>
                                <span
                                    className="badge"
                                    style={{
                                        background: "var(--surface)",
                                        border: "1px solid var(--border)",
                                        color: "var(--ink-soft)",
                                        fontSize: "0.72rem"
                                    }}
                                >
                                    Asistente
                                </span>
                            </div>

                            <p className="hint mb-2">
                                Escribe el nombre o código de un artículo (ejemplo: Leche, Café, Aceite, Arroz, Jugo) para autocompletar la información.
                            </p>

                            {/* Barra de busqueda del asistente */}
                            <div className="d-flex gap-2 mb-2">
                                <input
                                    ref={inputSugeridaRef}
                                    type="text"
                                    style={{
                                        flex: 1,
                                        padding: "9px 12px",
                                        borderRadius: "var(--radius-s)",
                                        border: "1px solid var(--border)",
                                        background: "var(--surface)",
                                        color: "var(--ink)"
                                    }}
                                    placeholder="Buscar producto o código..."
                                    value={busquedaSugerida}
                                    onChange={(e) => setBusquedaSugerida(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === "Enter") {
                                            e.preventDefault();
                                            handleBuscarClick();
                                        }
                                    }}
                                    disabled={estadoConsulta === "cargando"}
                                />
                                <button
                                    type="button"
                                    className="btn btn-accent"
                                    style={{ width: "auto", padding: "9px 16px" }}
                                    onClick={handleBuscarClick}
                                    disabled={estadoConsulta === "cargando"}
                                >
                                    {estadoConsulta === "cargando" ? "Buscando..." : "Buscar"}
                                </button>
                            </div>

                            {/* Sugerencias en chips */}
                            <div className="d-flex flex-wrap align-items-center gap-1 mb-2">
                                <span className="hint me-1">Sugerencias:</span>
                                {[
                                    { label: "Leche", query: "leche" },
                                    { label: "Café", query: "cafe" },
                                    { label: "Aceite", query: "aceite" },
                                    { label: "Arroz", query: "arroz" },
                                    { label: "Huevos", query: "huevos" },
                                    { label: "Jugo", query: "jugo" }
                                ].map((item) => (
                                    <button
                                        key={item.query}
                                        type="button"
                                        className="btn btn-ghost btn-small"
                                        style={{
                                            borderRadius: "20px",
                                            padding: "3px 10px",
                                            fontSize: "0.76rem"
                                        }}
                                        onClick={() => handleProbarSugerencia(item.query)}
                                        disabled={estadoConsulta === "cargando"}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </div>

                            {/* Estado Cargando */}
                            {estadoConsulta === "cargando" && (
                                <div className="hint text-center py-1">
                                    Buscando información sugerida...
                                </div>
                            )}

                            {/* Estado Encontrado */}
                            {estadoConsulta === "encontrado" && productoEncontrado && (
                                <div
                                    style={{
                                        background: "var(--success-bg)",
                                        border: "1px solid var(--success)",
                                        borderRadius: "var(--radius-s)",
                                        padding: "12px",
                                        color: "var(--ink)"
                                    }}
                                >
                                    <div className="d-flex justify-content-between align-items-center mb-1">
                                        <span style={{ fontWeight: 600, color: "var(--success)", fontSize: "0.85rem" }}>
                                            Información sugerida encontrada
                                        </span>
                                        {productoEncontrado.codigo && (
                                            <span style={{ fontSize: "0.75rem", color: "var(--ink-soft)" }}>
                                                Código: {productoEncontrado.codigo}
                                            </span>
                                        )}
                                    </div>
                                    <div style={{ fontWeight: 600, fontSize: "0.95rem" }}>
                                        {productoEncontrado.nombre}
                                    </div>
                                    <div style={{ fontSize: "0.82rem", color: "var(--ink-soft)", marginTop: "2px" }}>
                                        Categoría: {productoEncontrado.categoria} | Precio sugerido: ${productoEncontrado.precio}
                                    </div>
                                    <div className="hint" style={{ color: "var(--ink-soft)", marginTop: "4px" }}>
                                        Se completaron los campos abajo. Ajusta los valores para tu tienda.
                                    </div>
                                </div>
                            )}

                            {/* Estado No encontrado */}
                            {estadoConsulta === "no_encontrado" && (
                                <div
                                    style={{
                                        background: "var(--warning-bg)",
                                        border: "1px solid var(--warning)",
                                        borderRadius: "var(--radius-s)",
                                        padding: "10px 12px",
                                        fontSize: "0.83rem",
                                        color: "var(--warning)"
                                    }}
                                >
                                    {mensajeConsulta}
                                </div>
                            )}

                            {/* Estado Error */}
                            {estadoConsulta === "error" && (
                                <div
                                    style={{
                                        background: "var(--danger-bg)",
                                        border: "1px solid var(--danger)",
                                        borderRadius: "var(--radius-s)",
                                        padding: "10px 12px",
                                        fontSize: "0.83rem",
                                        color: "var(--danger)"
                                    }}
                                >
                                    {mensajeConsulta}
                                </div>
                            )}
                        </div>
                    )}

                    {/* SECCION 2: CAMPOS CON ESTILO NATIVO (.field) */}
                    <div className="row g-3 mx-0">
                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pCodigo">Código de barras / Identificador</label>
                            <input
                                type="text"
                                id="pCodigo"
                                name="codigo"
                                placeholder="Ej: 7501055300075"
                                value={formData.codigo}
                                onChange={handleChange}
                            />
                        </div>

                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pCategoria">Categoría *</label>
                            <select
                                id="pCategoria"
                                name="categoria"
                                value={formData.categoria}
                                onChange={handleChange}
                            >
                                <option value="">Selecciona una categoría</option>
                                {CATEGORIAS_VALIDAS.map((cat) => (
                                    <option key={cat} value={cat}>{cat}</option>
                                ))}
                            </select>
                            {errores.categoria && <p className="inline-error">{errores.categoria}</p>}
                        </div>

                        <div className="field col-12">
                            <label htmlFor="pNombre">Nombre del producto *</label>
                            <input
                                type="text"
                                id="pNombre"
                                name="nombre"
                                placeholder="Ej: Leche Entera 1L"
                                value={formData.nombre}
                                onChange={handleChange}
                            />
                            {errores.nombre && <p className="inline-error">{errores.nombre}</p>}
                        </div>

                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pCosto">Costo de adquisición ($) *</label>
                            <input
                                ref={inputCostoRef}
                                type="number"
                                step="0.01"
                                min="0.01"
                                id="pCosto"
                                name="costo"
                                placeholder="0.00"
                                value={formData.costo}
                                onChange={handleChange}
                            />
                            {errores.costo && <p className="inline-error">{errores.costo}</p>}
                        </div>

                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pPrecio">Precio de venta ($) *</label>
                            <input
                                type="number"
                                step="0.01"
                                min="0.01"
                                id="pPrecio"
                                name="precio"
                                placeholder="0.00"
                                value={formData.precio}
                                onChange={handleChange}
                            />
                            {errores.precio && <p className="inline-error">{errores.precio}</p>}
                        </div>

                        {/* Calculo de margen en tiempo real */}
                        {margenMonto !== null && (
                            <div className="col-12">
                                <div
                                    style={{
                                        background: "var(--surface-2)",
                                        border: "1px solid var(--border)",
                                        borderRadius: "var(--radius-s)",
                                        padding: "8px 12px",
                                        fontSize: "0.83rem",
                                        color: Number(margenMonto) > 0 ? "var(--ink)" : "var(--danger)"
                                    }}
                                >
                                    Margen de ganancia estimado: <strong>${margenMonto}</strong> por unidad
                                    {margenPorcentaje ? ` (${margenPorcentaje}%)` : ""}
                                </div>
                            </div>
                        )}

                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pStock">Stock inicial *</label>
                            <input
                                type="number"
                                step="1"
                                min="0"
                                id="pStock"
                                name="stock"
                                value={formData.stock}
                                onChange={handleChange}
                            />
                            {errores.stock && <p className="inline-error">{errores.stock}</p>}
                        </div>

                        <div className="field col-12 col-sm-6">
                            <label htmlFor="pStockMin">Stock mínimo *</label>
                            <input
                                type="number"
                                step="1"
                                min="0"
                                id="pStockMin"
                                name="stockMinimo"
                                value={formData.stockMinimo}
                                onChange={handleChange}
                            />
                            {errores.stockMinimo && <p className="inline-error">{errores.stockMinimo}</p>}
                        </div>
                    </div>

                    {/* PIE DEL MODAL CON BOTONES NATIVOS */}
                    <div className="modal-foot">
                        <button type="button" className="btn btn-ghost" onClick={onCerrar}>
                            Cancelar
                        </button>
                        <button type="submit" className="btn btn-accent">
                            {esEdicion ? "Guardar cambios" : "Guardar producto"}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    );
}

// ============================================================================
// COMPONENTE: Tarjeta Individual de Producto (Card)
// Formato limpio y compacto sin imagenes, enfocado en datos operativos.
// ============================================================================
function TarjetaProducto({ producto, onEditar, onEliminar }) {
    const stockNum = Number(producto.stock);
    const minNum = Number(producto.stockMinimo);
    const esCritico = stockNum <= minNum;
    const margen = (Number(producto.precio) - Number(producto.costo)).toFixed(2);

    return (
        <div className="col-12 col-md-6 col-lg-4">
            <div
                className="panel-box h-100 p-3 d-flex flex-column justify-content-between position-relative"
                style={{
                    border: "1px solid var(--border, #e5e7eb)",
                    borderRadius: "10px"
                }}
            >
                {/* Cabecera de la tarjeta: Categoria y Codigo */}
                <div>
                    <div className="d-flex justify-content-between align-items-center mb-2">
                        <span
                            className="badge"
                            style={{
                                background: "var(--surface-2, #f3f4f6)",
                                color: "var(--ink, #1f2937)",
                                border: "1px solid var(--border, #e5e7eb)",
                                fontSize: "0.75rem"
                            }}
                        >
                            {producto.categoria}
                        </span>

                        {producto.codigo && (
                            <span
                                className="badge font-monospace"
                                style={{
                                    background: "var(--surface-2, #f3f4f6)",
                                    color: "var(--ink-soft, #6b7280)",
                                    border: "1px solid var(--border, #e5e7eb)",
                                    fontSize: "0.72rem"
                                }}
                            >
                                {producto.codigo}
                            </span>
                        )}
                    </div>

                    {/* Nombre del producto */}
                    <h5
                        className="fw-bold mb-3"
                        style={{ fontSize: "1.05rem", lineHeight: "1.3" }}
                        title={producto.nombre}
                    >
                        {producto.nombre}
                    </h5>

                    {/* Cuadricula de datos financieros */}
                    <div
                        className="p-2 mb-3 rounded"
                        style={{
                            background: "var(--surface-2, #f9fafb)",
                            border: "1px solid var(--border, #f3f4f6)"
                        }}
                    >
                        <div className="row g-2 small text-secondary">
                            <div className="col-6">
                                <span>Costo:</span> <strong>${Number(producto.costo).toFixed(2)}</strong>
                            </div>
                            <div className="col-6">
                                <span>Precio:</span> <strong style={{ color: "var(--accent-ink, #0d6efd)" }}>${Number(producto.precio).toFixed(2)}</strong>
                            </div>
                            <div className="col-6">
                                <span>Margen:</span> <strong>${margen}</strong>
                            </div>
                            <div className="col-6">
                                <span>Stock mín:</span> <strong>{producto.stockMinimo} uds.</strong>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Pie con existencias y acciones */}
                <div className="pt-2 border-top d-flex justify-content-between align-items-center mt-2">
                    <div>
                        <span className="small text-muted me-1">Existencias:</span>
                        <span
                            className="badge"
                            style={{
                                background: esCritico ? "var(--danger-bg, #fee2e2)" : "var(--success-bg, #dcfce7)",
                                color: esCritico ? "var(--danger, #dc2626)" : "var(--success, #16a34a)",
                                fontWeight: "600",
                                fontSize: "0.8rem"
                            }}
                        >
                            {producto.stock} uds.
                        </span>
                    </div>

                    <div className="d-flex gap-1">
                        <button
                            type="button"
                            className="btn btn-ghost btn-small"
                            onClick={() => onEditar(producto)}
                            title="Editar producto"
                        >
                            Editar
                        </button>
                        <button
                            type="button"
                            className="btn btn-ghost btn-small text-danger"
                            onClick={() => onEliminar(producto)}
                            title="Eliminar producto"
                        >
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    );
}

// ============================================================================
// COMPONENTE: Barra de Filtros y Busqueda
// ============================================================================
function BarraFiltros({ busqueda, onCambiarBusqueda, categoria, onCambiarCategoria }) {
    return (
        <div className="panel-box mb-4">
            <div className="row g-3 align-items-center">
                <div className="col-12 col-md-7">
                    <div className="field mb-0">
                        <label htmlFor="buscadorProducto">Buscar producto</label>
                        <input
                            type="text"
                            id="buscadorProducto"
                            placeholder="Escribe el nombre, código o categoría..."
                            value={busqueda}
                            onChange={(e) => onCambiarBusqueda(e.target.value)}
                        />
                    </div>
                </div>

                <div className="col-12 col-md-5">
                    <div className="field mb-0">
                        <label htmlFor="filtroCategoria">Filtrar por categoría</label>
                        <select
                            id="filtroCategoria"
                            value={categoria}
                            onChange={(e) => onCambiarCategoria(e.target.value)}
                        >
                            <option value="">Todas las categorías</option>
                            {CATEGORIAS_VALIDAS.map((cat) => (
                                <option key={cat} value={cat}>{cat}</option>
                            ))}
                        </select>
                    </div>
                </div>
            </div>
        </div>
    );
}

// ============================================================================
// COMPONENTE: Lista de Productos
// ============================================================================
function ListaProductos({
    productos,
    busqueda,
    onEditar,
    onEliminar,
    onAbrirNuevo,
    onAbrirConTermino
}) {
    if (productos.length === 0) {
        const hayBusqueda = Boolean(busqueda && busqueda.trim());

        return (
            <div className="card shadow-sm border-0 text-center py-5" style={{ borderRadius: "12px" }}>
                <div className="card-body">
                    <div className="mb-3 text-muted">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>

                    <h5 className="text-secondary fw-semibold">
                        {hayBusqueda
                            ? "No encontramos ese producto en tu inventario local"
                            : "No hay productos registrados"}
                    </h5>

                    <p className="text-muted small mb-4" style={{ maxWidth: "500px", margin: "0 auto" }}>
                        {hayBusqueda
                            ? `No hay coincidencias para "${busqueda}". Puedes buscar sugerencias para agregarlo o registrarlo manualmente.`
                            : "Comienza agregando productos a tu catálogo. Puedes buscar artículos sugeridos o registrarlos manualmente."}
                    </p>

                    <div className="d-flex justify-content-center flex-wrap gap-2">
                        {hayBusqueda ? (
                            <>
                                <button
                                    type="button"
                                    className="btn btn-primary btn-sm px-3"
                                    onClick={() => onAbrirConTermino(busqueda)}
                                >
                                    Buscar sugerencias para "{busqueda}"
                                </button>
                                <button
                                    type="button"
                                    className="btn btn-outline-secondary btn-sm px-3"
                                    onClick={onAbrirNuevo}
                                >
                                    Registrar manualmente
                                </button>
                            </>
                        ) : (
                            <>
                                <button
                                    type="button"
                                    className="btn btn-primary btn-sm px-3"
                                    onClick={onAbrirNuevo}
                                >
                                    + Registrar primer producto
                                </button>
                                <button
                                    type="button"
                                    className="btn btn-outline-primary btn-sm px-3"
                                    onClick={() => onAbrirConTermino("")}
                                >
                                    Buscar en catálogo sugerido
                                </button>
                            </>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="row g-4">
            {productos.map((producto) => (
                <TarjetaProducto
                    key={producto.id}
                    producto={producto}
                    onEditar={onEditar}
                    onEliminar={onEliminar}
                />
            ))}
        </div>
    );
}

// ============================================================================
// COMPONENTE PRINCIPAL (AppProductos)
// ============================================================================
function AppProductos() {
    const [productos, setProductos] = useState([]);
    const [sesion, setSesion] = useState(null);
    const [busqueda, setBusqueda] = useState("");
    const [categoriaFiltro, setCategoriaFiltro] = useState("");

    // Control de modales y edicion
    const [modalAbierto, setModalAbierto] = useState(false);
    const [productoEditando, setProductoEditando] = useState(null);
    const [terminoParaBuscar, setTerminoParaBuscar] = useState("");

    useEffect(() => {
        const sesionActual = obtenerSesion();
        if (!sesionActual) {
            window.location.href = "MiTiendita/login.html";
            return;
        }
        setSesion(sesionActual);
        setProductos(leerProductos());

        const handleActualizacion = (e) => {
            if (!e || !e.detail || e.detail.clave === LS_PRODUCTOS) {
                setProductos(leerProductos());
            }
        };

        window.addEventListener("tienditaDatosActualizados", handleActualizacion);
        window.addEventListener("storage", handleActualizacion);

        return () => {
            window.removeEventListener("tienditaDatosActualizados", handleActualizacion);
            window.removeEventListener("storage", handleActualizacion);
        };
    }, []);

    const actualizarProductos = (nuevaLista) => {
        setProductos(nuevaLista);
        guardarProductos(nuevaLista);
    };

    const handleAbrirNuevo = () => {
        setProductoEditando(null);
        setTerminoParaBuscar("");
        setModalAbierto(true);
    };

    const handleAbrirConTermino = (termino) => {
        setProductoEditando(null);
        setTerminoParaBuscar(termino || "");
        setModalAbierto(true);
    };

    const handleEditar = (producto) => {
        setProductoEditando(producto);
        setTerminoParaBuscar("");
        setModalAbierto(true);
    };

    const handleGuardarProducto = (productoData) => {
        let listaActualizada;
        const existe = productos.some((p) => String(p.id) === String(productoData.id));

        if (existe) {
            listaActualizada = productos.map((p) =>
                String(p.id) === String(productoData.id) ? { ...p, ...productoData } : p
            );
        } else {
            listaActualizada = [productoData, ...productos];
        }

        actualizarProductos(listaActualizada);
        setModalAbierto(false);
        setProductoEditando(null);
        setTerminoParaBuscar("");

        if (typeof mostrarExito === "function") {
            mostrarExito(
                'El producto "' + productoData.nombre + '" fue guardado exitosamente.',
                "Operación exitosa"
            );
        }
    };

    const handleEliminar = async (producto) => {
        let confirmado = false;

        if (typeof confirmarAccion === "function") {
            confirmado = await confirmarAccion({
                titulo: "Eliminar producto",
                mensaje: '¿Estás seguro de eliminar "' + producto.nombre + '"? Esta acción no se puede deshacer.',
                textoConfirmar: "Sí, eliminar",
                textoCancelar: "Cancelar"
            });
        } else {
            confirmado = window.confirm('¿Deseas eliminar "' + producto.nombre + '"?');
        }

        if (!confirmado) return;

        const listaActualizada = productos.filter((p) => String(p.id) !== String(producto.id));
        actualizarProductos(listaActualizada);

        if (typeof mostrarExito === "function") {
            mostrarExito('"' + producto.nombre + '" fue eliminado correctamente.', "Eliminado");
        }
    };

    const productosFiltrados = useMemo(() => {
        const texto = busqueda.trim().toLowerCase();

        return productos.filter((p) => {
            const coincideTexto = !texto ||
                p.nombre.toLowerCase().includes(texto) ||
                (p.codigo && p.codigo.toLowerCase().includes(texto)) ||
                (p.categoria && p.categoria.toLowerCase().includes(texto));

            const coincideCategoria = !categoriaFiltro || p.categoria === categoriaFiltro;

            return coincideTexto && coincideCategoria;
        });
    }, [productos, busqueda, categoriaFiltro]);

    return (
        <div>
            {/* Encabezado */}
            <div className="view-head view-head-row mb-4">
                <div>
                    <h2>Catálogo de Productos</h2>
                    <p className="text-secondary mb-0">
                        Administración y control de productos del inventario.
                    </p>
                </div>

                <div className="d-flex align-items-center gap-2">
                    <span className="badge bg-secondary fs-6 px-3 py-2">
                        {productosFiltrados.length} {productosFiltrados.length === 1 ? "producto" : "productos"}
                    </span>
                    <button
                        type="button"
                        className="btn btn-ghost"
                        onClick={() => handleAbrirConTermino("")}
                        title="Buscar sugerencias en catálogo"
                    >
                        Buscar sugerencias
                    </button>
                    <button
                        type="button"
                        className="btn btn-accent"
                        onClick={handleAbrirNuevo}
                    >
                        + Nuevo producto
                    </button>
                </div>
            </div>

            {/* Barra de Filtros */}
            <BarraFiltros
                busqueda={busqueda}
                onCambiarBusqueda={setBusqueda}
                categoria={categoriaFiltro}
                onCambiarCategoria={setCategoriaFiltro}
            />

            {/* Lista de Productos */}
            <ListaProductos
                productos={productosFiltrados}
                busqueda={busqueda}
                onEditar={handleEditar}
                onEliminar={handleEliminar}
                onAbrirNuevo={handleAbrirNuevo}
                onAbrirConTermino={handleAbrirConTermino}
            />

            {/* Modal Formulario con Asistente de Sugerencias */}
            <FormularioProductoModal
                abierto={modalAbierto}
                onCerrar={() => {
                    setModalAbierto(false);
                    setProductoEditando(null);
                    setTerminoParaBuscar("");
                }}
                onGuardar={handleGuardarProducto}
                productoEditando={productoEditando}
                productosExistentes={productos}
                terminoInicialParaBuscar={terminoParaBuscar}
            />
        </div>
    );
}

// Montar la aplicación React en el contenedor root
const rootElement = document.getElementById("root");
if (rootElement) {
    ReactDOM.createRoot(rootElement).render(<AppProductos />);
}

</script>

</body>
</html>
