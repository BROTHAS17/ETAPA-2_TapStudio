<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Tiendita - Productos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Catálogo de Productos</h1>
                <p class="text-muted mb-0">
                    Administración de productos de Mi Tiendita
                </p>
            </div>

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalProducto"
            >
                + Nuevo producto
            </button>
        </div>

        <div class="mb-4">
            <label for="buscador" class="form-label">
                Buscar producto
            </label>

            <input
                type="text"
                id="buscador"
                class="form-control"
                placeholder="Escribe el nombre del producto..."
            >
        </div>

        <section>
            <div id="listaProductos" class="row g-4">
            </div>
        </section>

    </main>

    <div
        class="modal fade"
        id="modalProducto"
        tabindex="-1"
        aria-labelledby="tituloModal"
        aria-hidden="true"
    >
        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="tituloModal"
                    >
                        Nuevo producto
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>

                <form id="formProducto">

                    <div class="modal-body">

                        <div class="mb-3">

                            <label
                                for="nombre"
                                class="form-label"
                            >
                                Nombre del producto
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                required
                            >

                            <div class="invalid-feedback">
                                Ingresa el nombre del producto.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="categoria"
                                class="form-label"
                            >
                                Categoría
                            </label>

                            <select
                                id="categoria"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Selecciona una categoría
                                </option>

                                <option value="Bebidas">
                                    Bebidas
                                </option>

                                <option value="Snacks">
                                    Snacks
                                </option>

                                <option value="Lácteos">
                                    Lácteos
                                </option>

                                <option value="Dulces">
                                    Dulces
                                </option>

                                <option value="Limpieza">
                                    Limpieza
                                </option>

                                <option value="Otros">
                                    Otros
                                </option>
                            </select>

                            <div class="invalid-feedback">
                                Selecciona una categoría.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="costo"
                                class="form-label"
                            >
                                Costo de adquisición
                            </label>

                            <input
                                type="number"
                                id="costo"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required
                            >

                            <div class="invalid-feedback">
                                El costo debe ser mayor que 0.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="precio"
                                class="form-label"
                            >
                                Precio de venta
                            </label>

                            <input
                                type="number"
                                id="precio"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required
                            >

                            <div class="invalid-feedback">
                                El precio debe ser mayor que el costo.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="stock"
                                class="form-label"
                            >
                                Existencias
                            </label>

                            <input
                                type="number"
                                id="stock"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="stockMinimo"
                                class="form-label"
                            >
                                Stock mínimo
                            </label>

                            <input
                                type="number"
                                id="stockMinimo"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Guardar producto
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="js/productos.js"></script>

</body>
</html>
