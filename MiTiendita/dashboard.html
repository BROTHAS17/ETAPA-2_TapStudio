<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mi Tiendita</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                Mi Tiendita
            </a>

            <button class="btn btn-outline-light" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header text-white" style="background: linear-gradient(135deg, #5B21B6, #7C3AED);">
                <h3 class="mb-0">Mi Tiendita</h3>
            </div>

            <div class="card-body">

                <h4 class="mb-4">Bienvenido al Sistema de Inventario</h4>

                <div class="row">

                    <div class="col-md-4">
                        <div class="card border-primary mb-3">
                            <div class="card-body">
                                <h5>Nombre</h5>
                                <p id="nombreUsuario"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card border-success mb-3">
                            <div class="card-body">
                                <h5>Correo</h5>
                                <p id="correoUsuario"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card border-warning mb-3">
                            <div class="card-body">
                                <h5>Rol</h5>
                                <p id="rolUsuario"></p>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="alert alert-info mt-3">
                    Sesión iniciada correctamente.
                </div>

            </div>

        </div>

    </div>

    <script>
        const sesion = JSON.parse(localStorage.getItem("tiendita_sesion"));

        if (!sesion) {
            window.location.href = "login.html";
        } else {
            document.getElementById("nombreUsuario").textContent = sesion.nombre;
            document.getElementById("correoUsuario").textContent = sesion.email;
            document.getElementById("rolUsuario").textContent = sesion.rol;
        }

        function cerrarSesion() {
            localStorage.removeItem("tiendita_sesion");
            window.location.href = "login.html";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
