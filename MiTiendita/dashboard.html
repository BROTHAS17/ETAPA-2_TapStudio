
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mi Tiendita</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Mi Tiendita</a>

        <div class="d-flex align-items-center gap-2">
            <span id="nombreNavbar" class="text-white"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                Cerrar Sesión
            </button>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h1>Tablero Principal</h1>
        <p class="text-muted mb-0">Resumen de ventas e inventario.</p>
    </div>

    <!-- Indicadores principales -->
    <section class="row g-4 mb-4">

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Ventas del día</h6>
                    <h2 id="kpiVentasDia">$0.00</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Transacciones</h6>
                    <h2 id="kpiTransacciones">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Productos</h6>
                    <h2 id="kpiProductos">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Stock crítico</h6>
                    <h2 id="kpiStockCritico">0</h2>
                </div>
            </div>
        </div>

    </section>

    <!-- Accesos a los módulos -->
    <section class="card shadow-sm">
        <div class="card-body">

            <h5 class="mb-3">Accesos</h5>

            <div class="d-flex flex-wrap gap-2">

                <a class="btn btn-primary" href="../ventas.html">
                    Punto de Venta
                </a>

                <a class="btn btn-outline-primary" href="../compras.html">
                    Compras
                </a>

                <a class="btn btn-outline-primary" href="../proveedores.html">
                    Proveedores
                </a>

                <a class="btn btn-outline-primary" href="../productos.html">
                    Productos
                </a>

                <a class="btn btn-outline-primary" href="../inventario.html">
                    Inventario
                </a>

            </div>
        </div>
    </section>

</main>

<script>
    "use strict";

    const LS_SESION = "tiendita_sesion";
    const LS_VENTAS = "tiendita_ventas";
    const LS_PRODUCTOS = "tiendita_productos";

    function leerLista(clave) {
        try {
            const datos = JSON.parse(localStorage.getItem(clave));
            return Array.isArray(datos) ? datos : [];
        } catch (error) {
            console.error("Error al leer " + clave + ":", error);
            return [];
        }
    }

    // Validar sesión
    let sesion = null;

    try {
        sesion = JSON.parse(localStorage.getItem(LS_SESION));
    } catch (error) {
        console.error("Error al consultar la sesión:", error);
    }

    if (!sesion) {
        window.location.href = "login.html";
    } else {
        document.getElementById("nombreNavbar").textContent =
            sesion.nombre || "Usuario";
    }

    // Actualizar indicadores del dashboard
    function actualizarDashboard() {
        const ventas = leerLista(LS_VENTAS);
        const productos = leerLista(LS_PRODUCTOS);

        // Fecha local para calcular las ventas del día
        const ahora = new Date();
        const inicioDia = new Date(
            ahora.getFullYear(),
            ahora.getMonth(),
            ahora.getDate()
        );

        const finDia = new Date(
            ahora.getFullYear(),
            ahora.getMonth(),
            ahora.getDate() + 1
        );

        const ventasHoy = ventas.filter(venta => {
            const fecha = new Date(venta.fecha);

            return !Number.isNaN(fecha.getTime()) &&
                fecha >= inicioDia &&
                fecha < finDia;
        });

        const totalDia = ventasHoy.reduce((total, venta) => {
            const importe = Number(venta.total);
            return total + (
                Number.isFinite(importe) && importe > 0 ? importe : 0
            );
        }, 0);

        const stockCritico = productos.filter(producto => {
            const stock = Number(producto.stock);
            const minimo = Number(producto.stockMinimo);

            return Number.isFinite(stock) &&
                Number.isFinite(minimo) &&
                stock <= minimo;
        }).length;

        document.getElementById("kpiVentasDia").textContent =
            "$" + totalDia.toFixed(2);

        document.getElementById("kpiTransacciones").textContent =
            ventas.length;

        document.getElementById("kpiProductos").textContent =
            productos.length;

        document.getElementById("kpiStockCritico").textContent =
            stockCritico;
    }

    // Cerrar sesión
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem(LS_SESION);
        window.location.href = "login.html";
    });

    actualizarDashboard();
</script>

</body>
</html>
