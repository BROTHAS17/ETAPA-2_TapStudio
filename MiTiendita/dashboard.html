
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mi Tiendita</title>
    <link rel="stylesheet" href="css/alertas.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .dashboard-container {
            max-width: 1500px;
        }

        .kpi-card {
            min-height: 123px;
            border-radius: 8px;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 600;
            color: #212529;
        }

        .access-card {
            border-radius: 8px;
        }

        .access-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                Mi Tiendita
            </a>

            <div class="d-flex align-items-center gap-2">
                <span id="nombreNavbar" class="text-white"></span>

                <button
                    class="btn btn-outline-light btn-sm"
                    id="logoutBtn"
                    type="button"
                >
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container dashboard-container py-5">

        <div class="mb-4">
            <h1 class="display-5 fw-semibold">Tablero Principal</h1>
            <p class="text-muted mb-0">
                Resumen de ventas e inventario.
            </p>
        </div>

        <!-- Indicadores principales -->
        <section class="row g-4 mb-4">

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card shadow-sm kpi-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Ventas del día</h6>
                        <div id="kpiVentasDia" class="kpi-value">$0.00</div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card shadow-sm kpi-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Transacciones</h6>
                        <div id="kpiTransacciones" class="kpi-value">0</div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card shadow-sm kpi-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Productos</h6>
                        <div id="kpiProductos" class="kpi-value">0</div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card shadow-sm kpi-card h-100">
                    <div class="card-body">
                        <h6 class="text-muted">Stock crítico</h6>
                        <div id="kpiStockCritico" class="kpi-value">0</div>
                    </div>
                </div>
            </div>

        </section>

        <!-- Accesos a los módulos -->
        <section class="card shadow-sm access-card">
            <div class="card-body p-4">
                <h5 class="mb-3">Accesos</h5>

                <div class="access-links">
                    <a class="btn btn-primary" href="../ventas.html">
                        Punto de Venta
                    </a>

                    <a class="btn btn-outline-primary" href="../compras.html">
                        Compras
                    </a>

                    <a class="btn btn-outline-primary" href="../proveedores.html">
                        Proveedores
                    </a>

                    <a class="btn btn-outline-primary" href="../productos.html">
                        Productos
                    </a>

                    <a class="btn btn-outline-primary" href="../inventario.html">
                        Inventario
                    </a>
                </div>
            </div>
        </section>

    </main>

    <script>
        "use strict";

        const LS_VENTAS = "tiendita_ventas";
        const LS_PRODUCTOS = "tiendita_productos";
        const LS_SESION = "tiendita_sesion";

        // Leer listas almacenadas.
        function leerLista(clave) {
            try {
                const datos = JSON.parse(localStorage.getItem(clave) || "[]");
                return Array.isArray(datos) ? datos : [];
            } catch (error) {
                console.error("Error al leer " + clave, error);
                return [];
            }
        }

        // Obtener la fecha local en formato YYYY-MM-DD.
        function obtenerFechaLocal(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, "0");
            const dia = String(fecha.getDate()).padStart(2, "0");

            return `${anio}-${mes}-${dia}`;
        }

        // Validar sesión y mostrar el nombre del usuario.
        function validarSesion() {
            const sesionGuardada = localStorage.getItem(LS_SESION);

            if (!sesionGuardada) {
                window.location.replace("login.html");
                return false;
            }

            try {
                const sesion = JSON.parse(sesionGuardada);

                const nombre =
                    sesion.nombre ||
                    sesion.nombreUsuario ||
                    sesion.usuario ||
                    sesion.username ||
                    "Usuario";

                document.getElementById("nombreNavbar").textContent = nombre;
            } catch (error) {
                console.error("No se pudo leer la sesión.", error);
                document.getElementById("nombreNavbar").textContent = "Usuario";
            }

            return true;
        }

        // Actualizar los indicadores del tablero.
        function actualizarDashboard() {
            const ventas = leerLista(LS_VENTAS);
            const productos = leerLista(LS_PRODUCTOS);
            const fechaHoy = obtenerFechaLocal(new Date());

            const ventasHoy = ventas.filter(venta => {
                if (!venta.fecha) return false;

                const fechaVenta = new Date(venta.fecha);

                if (Number.isNaN(fechaVenta.getTime())) {
                    return false;
                }

                return obtenerFechaLocal(fechaVenta) === fechaHoy;
            });

            const totalDia = ventasHoy.reduce((total, venta) => {
                return total + (Number(venta.total) || 0);
            }, 0);

            const stockCritico = productos.filter(producto => {
                const stock = Number(producto.stock);
                const minimo = Number(
                    producto.stockMinimo ?? producto.stock_minimo ?? 0
                );

                return Number.isFinite(stock) &&
                    Number.isFinite(minimo) &&
                    stock <= minimo;
            });

            document.getElementById("kpiVentasDia").textContent =
                "$" + totalDia.toFixed(2);

            document.getElementById("kpiTransacciones").textContent =
                ventas.length;

            document.getElementById("kpiProductos").textContent =
                productos.length;

            document.getElementById("kpiStockCritico").textContent =
                stockCritico.length;
        }

        // Cerrar sesión.
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem(LS_SESION);
            window.location.replace("login.html");
        });

        // Inicializar tablero.
            if (validarSesion()) {
                actualizarDashboard();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/alertas.js"></script>

</body>
</html>
