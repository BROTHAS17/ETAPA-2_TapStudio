
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de proveedores | Mi Tiendita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="MiTiendita/dashboard.html">Mi Tiendita</a>
      <a class="btn btn-outline-light btn-sm" href="MiTiendita/dashboard.html">Volver al dashboard</a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-1">Gestión de proveedores</h1>
    <p class="text-secondary mb-4">Registra y consulta los proveedores de tu negocio.</p>

    <div class="row g-4">
      <div class="col-lg-5">
        <section class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3" id="tituloFormulario">Registrar proveedor</h2>

            <form id="formProveedor" novalidate>
              <input type="hidden" id="proveedorId">

              <div class="mb-3">
                <label for="nombreProveedor" class="form-label">Nombre del proveedor *</label>
                <input type="text" id="nombreProveedor" class="form-control" maxlength="100" required>
                <div class="invalid-feedback">Ingresa el nombre del proveedor.</div>
              </div>

              <div class="mb-3">
                <label for="telefonoProveedor" class="form-label">Teléfono *</label>
                <input type="tel" id="telefonoProveedor" class="form-control" maxlength="20" required>
                <div class="invalid-feedback">Ingresa un teléfono válido.</div>
              </div>

              <div class="mb-3">
                <label for="correoProveedor" class="form-label">Correo electrónico</label>
                <input type="email" id="correoProveedor" class="form-control" maxlength="120">
                <div class="invalid-feedback">Ingresa un correo válido.</div>
              </div>

              <div class="mb-3">
                <label for="empresaProveedor" class="form-label">Empresa</label>
                <input type="text" id="empresaProveedor" class="form-control" maxlength="100">
              </div>

              <div class="mb-3">
                <label for="direccionProveedor" class="form-label">Dirección</label>
                <textarea id="direccionProveedor" class="form-control" rows="2" maxlength="250"></textarea>
              </div>

              <div id="mensajeProveedor" class="alert d-none" role="alert"></div>

              <button type="submit" class="btn btn-primary" id="btnGuardarProveedor">Guardar proveedor</button>
              <button type="button" class="btn btn-outline-secondary" id="btnCancelarEdicion">Limpiar</button>
            </form>
          </div>
        </section>
      </div>

      <div class="col-lg-7">
        <section class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Proveedores registrados</h2>

            <div class="mb-3">
              <label for="buscarProveedor" class="form-label">Buscar proveedor</label>
              <input type="search" id="buscarProveedor" class="form-control"
                     placeholder="Buscar por nombre, empresa o teléfono">
            </div>

            <div id="estadoProveedores" class="text-secondary small mb-2" aria-live="polite"></div>

            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr>
                    <th>Proveedor</th>
                    <th>Contacto</th>
                    <th>Empresa</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaProveedores"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/proveedores.js"></script>
</body>
</html>
