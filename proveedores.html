<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proveedores | La Tiendita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css?v=20261021-proveedores">

  <style>
    .proveedores-main {
      padding: 32px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .proveedores-layout {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 24px;
    }

    .proveedores-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    .proveedores-panel h3 {
      margin-bottom: 18px;
    }

    .proveedores-table {
      width: 100%;
      border-collapse: collapse;
    }

    .proveedores-table th,
    .proveedores-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .proveedores-table th {
      color: var(--ink-soft);
      font-size: 0.85rem;
    }

    .alert {
      padding: 10px 12px;
      border-radius: var(--radius-s);
      margin-bottom: 14px;
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success);
    }

    .alert-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .alert-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    @media (max-width: 850px) {
      .proveedores-main {
        padding: 20px;
      }

      .proveedores-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⌂</span>

      <div class="brand-text">
        <h1>La Tiendita</h1>
        <p>Gestión de proveedores</p>
      </div>
    </div>

    <div class="who">
      <a href="index.html" class="btn btn-ghost btn-small">
        Volver al panel
      </a>
    </div>
  </header>

  <main class="proveedores-main">

    <div class="view-head">
      <h2>Proveedores</h2>
      <p>Registra y administra los proveedores de la tienda.</p>
    </div>

    <div class="proveedores-layout">

      <section class="proveedores-panel">
        <h3 id="tituloFormulario">Registrar proveedor</h3>

        <form id="formProveedor" novalidate>
          <input type="hidden" id="proveedorId">

          <div class="field">
            <label for="nombreProveedor">Nombre del proveedor *</label>
            <input
              type="text"
              id="nombreProveedor"
              maxlength="100"
              required
            >
          </div>

          <div class="field">
            <label for="telefonoProveedor">Teléfono *</label>
            <input
              type="tel"
              id="telefonoProveedor"
              maxlength="20"
              required
            >
          </div>

          <div class="field">
            <label for="correoProveedor">Correo electrónico</label>
            <input
              type="email"
              id="correoProveedor"
              maxlength="120"
            >
          </div>

          <div class="field">
            <label for="empresaProveedor">Empresa</label>
            <input
              type="text"
              id="empresaProveedor"
              maxlength="100"
            >
          </div>

          <div class="field">
            <label for="direccionProveedor">Dirección</label>
            <textarea
              id="direccionProveedor"
              rows="3"
              maxlength="250"
            ></textarea>
          </div>

          <div id="mensajeProveedor" class="alert d-none"></div>

          <button
            type="submit"
            class="btn btn-accent"
            id="btnGuardarProveedor"
          >
            Guardar proveedor
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            id="btnCancelarEdicion"
          >
            Limpiar
          </button>
        </form>
      </section>

      <section class="proveedores-panel">
        <h3>Proveedores registrados</h3>

        <div class="field">
          <label for="buscarProveedor">Buscar proveedor</label>
          <input
            type="search"
            id="buscarProveedor"
            placeholder="Buscar por nombre, empresa o teléfono"
          >
        </div>

        <div id="estadoProveedores" class="hint"></div>

        <div class="u-scroll">
          <table class="proveedores-table">
            <thead>
              <tr>
                <th>Proveedor</th>
                <th>Contacto</th>
                <th>Empresa</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tablaProveedores"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/proveedores.js?v=20261021-sweetalert"></script>

</body>
</html>
