<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Tiendita · Compras</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261014-bootstrap">
</head>
<body>

<div id="appShell">
  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9l1-5h14l1 5"></path>
          <path d="M3 9h18"></path>
          <path d="M5 9v10h14V9"></path>
          <path d="M9 19v-6h6v6"></path>
        </svg>
      </span>
      <div class="brand-text">
        <h1>La Tiendita</h1>
        <p>Sistema de inventario</p>
      </div>
    </div>
    <div class="who">
      <span class="sync-pill" id="syncPill">
        <span class="dot neutral" id="syncDot"></span>
        <span id="syncPillText">En línea</span>
      </span>
      <div class="who-chip">
        <div class="name" id="whoName">—</div>
        <div class="role" id="whoRole">Administrador/a</div>
      </div>
      <button class="btn btn-ghost btn-small" id="logoutBtn" type="button">Salir</button>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL CON BARRA LATERAL -->
  <div class="layout">
    <!-- BARRA LATERAL IZQUIERDA -->
    <nav class="sidebar" id="sidebarNav"></nav>

    <!-- ÁREA DE CONTENIDO -->
    <main id="mainArea">
      <div id="compras-root">
        <div class="p-4 text-center text-muted">Cargando módulo de compras...</div>
      </div>
    </main>
  </div>

  <!-- NAVEGACIÓN MÓVIL INFERIOR -->
  <nav class="bottom-tabs" id="bottomNav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/sidebar.js"></script>
<script src="js/alertas.js"></script>
<script src="js/compras.js"></script>

</body>
</html>
